name: App Store build

on:
  push:
    branches: [ master, main, nextcloud35, 'cjh-*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NC_REPO: Camerata-Academica-Freibug-e-V/nextcloud-server
  NC_BRANCH: cjh-stable35
  APP_NAME: cafevdb
  PHP_VERSION: '8.5'

jobs:
  appstore-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modified Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NC_REPO }}
          ref: ${{ env.NC_BRANCH }}
          submodules: recursive
          path: server

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ env.APP_NAME }}
          submodules: recursive

      - name: Install xpath and dictionary build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml-xpath-perl 7zip curl

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, curl, dom, gd, iconv, intl, json, mbstring, openssl, pdo_sqlite, posix, sqlite3, xml, zip, apcu, bcmath, gmp, imagick, fileinfo
          coverage: none
          tools: composer:v2
          ini-values: apc.enable_cli=1, memory_limit=1G

      - name: Install Nextcloud (sqlite)
        working-directory: server
        run: |
          composer install --no-interaction --no-progress
          php occ maintenance:install --database=sqlite \
            --admin-user=admin --admin-pass=admin --no-interaction
          php occ config:system:set debug --value=true --type=boolean

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/apps/${{ env.APP_NAME }}/package-lock.json

      # Type generation needs Nextcloud (SQLite), but no app database or user.
      - name: Full build
        working-directory: server/apps/${{ env.APP_NAME }}
        run: |
          if [ -e .clipassword ] || systemctl is-active --quiet mariadb; then
            echo 'The full build must run without app database credentials or an active MariaDB service.' >&2
            exit 1
          fi
          make dev-setup npm-build

      # Packaging also needs the Nextcloud server's 3rdparty directory.
      - name: Build unsigned app-store archive
        working-directory: server/apps/${{ env.APP_NAME }}
        run: make appstore APPSTORE_SIGN=0

      - name: Exercise packaged word splitter after relocation
        working-directory: server/apps/${{ env.APP_NAME }}
        run: |
          python3.13 tests/scripts/word-splitter-smoke.py \
            build/artifacts/appstore/${{ env.APP_NAME }}-*.tar.gz
